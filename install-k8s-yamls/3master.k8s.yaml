hosts:
  masters:
    k8s_master1:
      hostname: master1
      ip: 192.168.170.48
      user: root
      password: your_password
      plugin:
        traefikServer: true
    k8s_master2:
      hostname: master2
      ip: 192.168.170.49
      user: root
      password: your_password
      plugin:
        registryServer:
          alias: registry.local
        nfsServer: true
    k8s_master3:
      hostname: master3
      ip: 192.168.170.47
      user: root
      password: your_password
      plugin:
        apiserverLB:
          alias: apiserver.cluster.local
        timeServer: true
  workers:
    k8s_worker1:
      hostname: node1
      ip: 192.168.170.22
      user: root
      password: your_password
  #   k8s_worker2:
