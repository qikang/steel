apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-config
  namespace: sn01
data:
  traefik.yaml: |-
    global:
      checkNewVersion: true
      sendAnonymousUsage: true
    entryPoints:
      metrics:
        address: ":9100/tcp"
      traefik:
        address: ":9000/tcp"
      web:
        address: ":8000/tcp"
      websecure:
        address: ":8443/tcp"
        http:
          tls: false
    providers:
      kubernetescrd:
        ingressclass: "sn01"
        namespaces:
          - "sn01"
          - "cloud"
      kubernetesingress:
        namespaces:
          - "sn01"
          - "cloud"
    api: 
      insecure: true
      dashboard: true
    ping: true
    log:
      level: INFO
    # accessLog:
    #   format: json
    #   bufferingSize: 42
    #   addInternals: true
