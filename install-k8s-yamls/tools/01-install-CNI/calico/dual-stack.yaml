apiVersion: operator.tigera.io/v1
kind: Installation
metadata:
  name: default
spec:
  calicoNetwork:
     # Note: The ipPools section cannot be modified post-install.
    ipPools:
      - blockSize: 26
        cidr: 10.244.0.0/16
        encapsulation: VXLAN
        natOutgoing: Enabled
        nodeSelector: all()
      - blockSize: 122
        cidr: fd00:db81:2233:5656:1212:1212::/109
        encapsulation: VXLAN
        natOutgoing: Enabled
        nodeSelector: all()
  registry: registry.local:5000/
