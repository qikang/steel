
- name: copy tools to all masters node.
  hosts: masters
  copy:
    src: install-k8s-yamls/tools
    dest: "{{ data_root }}/tools"

# --- install CNI ---
- name: install k8s CNI on the apiserver node.
  hosts: {{ apiserverLB.hostName }}
  shell:
    cmd: /bin/bash install-cni.sh
    chdir: "{{ data_root }}/tools/01-install-CNI"
    bash: /bin/bash

# --- kubernetes-dashboard ---
- name: install kubernetes-dashboard on the apiserver node.
  hosts: masters
  shell:
    cmd: /bin/bash install-dashboard.sh
    chdir: "{{ data_root }}/tools/02-kubernetes-dashboard"
    bash: /bin/bash
  execution_mode: serial

# --- echo Installation Complete. ---
- name: Installation Complete !
  hosts: masters
  shell:
    cmd: echo "Installation Complete"
    chdir: "{{ data_root }}"
    bash: /bin/bash
    

